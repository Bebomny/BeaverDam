services:
  postgres-db:
    image: 'postgres:latest'
    container_name: "modulith-dev-db"
    environment:
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
    volumes:
      - ./run/postgres-data:/var/lib/postgresql
    ports:
      - "5432:5432"
